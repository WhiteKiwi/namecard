name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vVERSION tag to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require release source on main
        run: git merge-base --is-ancestor HEAD origin/main

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Require matching package version
        run: node -e 'const v=require("./package.json").version; if(process.env.RELEASE_TAG!=="v"+v) throw Error("Release tag/version mismatch")'

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --side-effects-cache=false

      - name: Build static site
        run: pnpm build

      - name: Check syntax, unit tests and public output
        run: pnpm check

      - name: Pack verified candidate
        run: pnpm release:pack

      - name: Transfer candidate to publisher
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate
          path: |
            release/namecard.tar.gz
            release/manifest.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # No checkout or dependency scripts in the job holding the write token.
      - uses: actions/download-artifact@v7
        with:
          name: release-candidate
          path: release

      - name: Verify transferred checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Publish immutable candidate
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const tag = process.env.RELEASE_TAG;
            // Never synthesize a release from a branch or overwrite an existing release.
            const manifest = JSON.parse(fs.readFileSync('release/manifest.json', 'utf8'));
            const {data: ref} = await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
            let object = ref.object;
            while (object.type === 'tag') {
              const {data: annotated} = await github.rest.git.getTag({...context.repo, tag_sha: object.sha});
              object = annotated.object;
            }
            if (object.type !== 'commit' || object.sha !== manifest.source) {
              throw new Error('Release tag moved after build; refusing publication');
            }
            const {data: release} = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: tag,
              body: 'Verified static namecard candidate. Production activation is a separate operator step.'
            });
            for (const name of ['namecard.tar.gz', 'manifest.json', 'SHA256SUMS']) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name,
                data: fs.readFileSync(`release/${name}`)
              });
            }
