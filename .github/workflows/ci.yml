name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  check:
    runs-on: whitekiwi-ubuntu
    timeout-minutes: 10
    env:
      NODE_USE_ENV_PROXY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile --store-dir /cache/shared/.pnpm --side-effects-cache=false

      - run: pnpm build && pnpm check
