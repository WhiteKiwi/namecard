name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  check:
    # Preserve private CI policy until the owner approves public visibility.
    runs-on: ${{ github.event.repository.private && 'whitekiwi-ubuntu' || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      NODE_USE_ENV_PROXY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          cache: ${{ !github.event.repository.private }}

      - name: Install locked dependencies (public)
        if: github.event.repository.private == false
        run: pnpm install --frozen-lockfile --side-effects-cache=false

      - name: Install locked dependencies (private transition)
        if: github.event.repository.private
        run: pnpm install --frozen-lockfile --store-dir /cache/shared/.pnpm --side-effects-cache=false

      - name: Build static site
        run: pnpm build

      - name: Check syntax, unit tests and public output
        run: pnpm check
